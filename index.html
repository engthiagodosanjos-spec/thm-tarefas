<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>THM • Central de Tarefas & WhatsApp</title>
<meta name="theme-color" content="#007BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="THM Tarefas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='55' cy='50' r='34' fill='%23007BFF'/%3E%3Cg fill='%23FFC800'%3E%3Cpath d='M46 50 L18 50 M44 30 L22 22 M44 70 L22 78 M50 26 L42 6 M50 74 L42 94' stroke='%23FFC800' stroke-width='7' stroke-linecap='round'/%3E%3C/g%3E%3Cpath d='M58 28 L40 54 L52 54 L46 74 L68 46 L55 46 Z' fill='%23FFC800'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffffff'/%3E%3Ccircle cx='58' cy='50' r='30' fill='%23007BFF'/%3E%3Cpath d='M48 50 L22 50 M46 32 L26 25 M46 68 L26 75' stroke='%23FFC800' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M60 30 L44 52 L54 52 L49 70 L68 46 L57 46 Z' fill='%23FFC800'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22THM%20Central%20de%20Tarefas%22%2C%22short_name%22%3A%22THM%20Tarefas%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23007BFF%22%2C%22theme_color%22%3A%22%23007BFF%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#007BFF; --azul-escuro:#0A2540; --amarelo:#FFC800; --verde:#43B02A;
    --branco:#FFFFFF; --fundo:#F2F5FA; --cinza:#6B7C93; --cinza-claro:#E3E9F2;
    --texto:#132641; --sombra:0 2px 10px rgba(10,37,64,.08); --sombra-f:0 8px 30px rgba(10,37,64,.18);
    --radius:16px; --font:'Montserrat','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--fundo);color:var(--texto);line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  button{font-family:var(--font);cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:var(--font);font-size:16px}

  /* HEADER */
  header{background:linear-gradient(135deg,var(--azul) 0%,#0056d6 100%);color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;box-shadow:var(--sombra);
    position:sticky;top:0;z-index:50}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
  .brand-txt h1{font-size:18px;font-weight:800;letter-spacing:.5px;line-height:1}
  .brand-txt span{font-size:10px;font-weight:600;letter-spacing:1.5px;opacity:.9;text-transform:uppercase}
  .tagline{font-size:9px;letter-spacing:2px;text-align:center;margin-top:8px;opacity:.85;
    font-weight:600;text-transform:uppercase}

  /* TABS */
  .tabs{display:flex;background:var(--azul-escuro);position:sticky;top:0;z-index:40}
  .tabs button{flex:1;color:#fff;padding:14px 8px;font-size:13px;font-weight:700;opacity:.65;
    border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:7px;
    transition:.2s}
  .tabs button.active{opacity:1;border-bottom-color:var(--amarelo)}
  .tabs button svg{width:18px;height:18px}

  main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
  .view{display:none}.view.active{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* BOTÕES */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;
    font-weight:700;font-size:14px;padding:11px 16px;transition:.15s;white-space:nowrap}
  .btn:active{transform:scale(.96)}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-amarelo{background:var(--amarelo);color:var(--azul-escuro)}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-ghost{background:var(--branco);color:var(--azul);border:1.5px solid var(--cinza-claro)}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn-ico{padding:9px;border-radius:10px;width:38px;height:38px}
  .btn-wide{width:100%}
  .btn svg{width:16px;height:16px}

  /* LISTAS (CHIPS) */
  .lists-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;
    scrollbar-width:none}
  .lists-bar::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--branco);border:1.5px solid var(--cinza-claro);border-radius:30px;
    padding:9px 15px;font-weight:700;font-size:13px;color:var(--texto);display:flex;align-items:center;gap:7px;
    box-shadow:var(--sombra);transition:.15s}
  .chip.active{background:var(--azul);color:#fff;border-color:var(--azul)}
  .chip .emoji{font-size:15px}
  .chip .count{background:rgba(0,0,0,.08);border-radius:20px;padding:1px 8px;font-size:11px}
  .chip.active .count{background:rgba(255,255,255,.25)}
  .chip-add{flex:none;background:var(--amarelo);color:var(--azul-escuro);border:none;border-radius:30px;
    padding:9px 15px;font-weight:800;font-size:13px;box-shadow:var(--sombra);display:flex;align-items:center;gap:6px}

  /* CARD DA LISTA */
  .card{background:var(--branco);border-radius:var(--radius);box-shadow:var(--sombra);
    padding:16px;margin-bottom:14px}
  .list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .list-head h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;min-width:0}
  .list-head h2 .emoji{font-size:22px;flex:none}
  .list-head h2 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-menu{position:relative;flex:none}
  .menu-pop{position:absolute;right:0;top:44px;background:#fff;border-radius:12px;box-shadow:var(--sombra-f);
    padding:6px;z-index:30;min-width:190px;display:none}
  .menu-pop.open{display:block}
  .menu-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:9px;
    font-size:14px;font-weight:600;color:var(--texto);text-align:left}
  .menu-pop button:active{background:var(--fundo)}
  .menu-pop button.danger{color:#D32F2F}
  .menu-pop svg{width:17px;height:17px}

  /* PROGRESSO */
  .progress-wrap{margin:10px 0 14px}
  .progress-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;
    color:var(--cinza);margin-bottom:6px}
  .progress-bar{height:9px;background:var(--cinza-claro);border-radius:20px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--verde),#5bc93f);border-radius:20px;
    transition:width .35s ease;width:0}

  /* ADD ITEM */
  .add-row{display:flex;gap:8px;margin-bottom:14px}
  .add-row input{flex:1;border:1.5px solid var(--cinza-claro);border-radius:12px;padding:12px 14px;
    background:var(--fundo);outline:none;transition:.15s}
  .add-row input:focus{border-color:var(--azul);background:#fff}

  /* ITEM */
  .item{border:1.5px solid var(--cinza-claro);border-radius:13px;padding:12px;margin-bottom:10px;
    transition:.15s;background:#fff}
  .item.done{background:#F3FAF0;border-color:#CDE9C3}
  .item-main{display:flex;align-items:flex-start;gap:11px}
  .checkbox{flex:none;width:26px;height:26px;border-radius:8px;border:2.5px solid var(--cinza-claro);
    display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;background:#fff}
  .item.done .checkbox{background:var(--verde);border-color:var(--verde)}
  .checkbox svg{width:15px;height:15px;stroke:#fff;stroke-width:3.5;opacity:0;transition:.15s}
  .item.done .checkbox svg{opacity:1}
  .item-body{flex:1;min-width:0}
  .item-text{font-weight:600;font-size:15px;word-break:break-word}
  .item.done .item-text{text-decoration:line-through;color:var(--cinza)}
  .item-actions{display:flex;gap:4px;flex:none}
  .ico-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--cinza);transition:.15s}
  .ico-btn:active{background:var(--fundo)}
  .ico-btn svg{width:17px;height:17px}
  .ico-btn.has-comment{color:var(--amarelo)}
  .comment-box{margin-top:9px;display:none}
  .comment-box.open{display:block}
  .comment-box textarea{width:100%;border:1.5px solid var(--cinza-claro);border-radius:10px;
    padding:9px 11px;resize:vertical;min-height:52px;background:var(--fundo);outline:none}
  .comment-box textarea:focus{border-color:var(--amarelo);background:#fff}
  .comment-preview{margin-top:7px;font-size:13px;color:var(--cinza);background:#FFF9E6;
    border-left:3px solid var(--amarelo);padding:7px 10px;border-radius:0 8px 8px 0;display:none}
  .comment-preview.show{display:block}

  .list-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .list-footer .btn{flex:1;min-width:140px}

  /* MENSAGENS WHATSAPP */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
  .search{flex:1;position:relative}
  .search input{width:100%;border:1.5px solid var(--cinza-claro);border-radius:12px;
    padding:11px 14px 11px 40px;background:#fff;outline:none;box-shadow:var(--sombra)}
  .search input:focus{border-color:var(--azul)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--cinza)}
  .client-bar{margin-bottom:12px}
  .client-field{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--amarelo);
    border-radius:12px;padding:3px 6px 3px 12px;box-shadow:var(--sombra)}
  .client-field>svg{width:19px;height:19px;color:var(--azul);flex:none}
  .client-field input{flex:1;border:none;background:none;outline:none;padding:10px 4px;font-weight:700;color:var(--texto)}
  .client-clear{width:34px;height:34px;border-radius:9px;display:none;align-items:center;justify-content:center;flex:none}
  .client-clear.show{display:flex}
  .client-clear svg{width:17px;height:17px;color:var(--cinza)}
  .ph-fill{background:#FFF3C4;color:#7a5c00;font-weight:800;padding:0 4px;border-radius:5px}
  .head-ctrls{display:flex;align-items:center;gap:2px;flex:none}
  .list-star{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
  .list-star svg{width:21px;height:21px;fill:none;stroke:var(--cinza);stroke-width:1.8}
  .list-star.on svg{fill:var(--amarelo);stroke:var(--amarelo)}
  .ico-btn[disabled]{opacity:.22;pointer-events:none}
  .reorder{display:flex;flex-direction:column;gap:2px;flex:none;justify-content:center;margin-right:2px}
  .reorder button{width:28px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--cinza);border-radius:6px}
  .reorder button:active{background:var(--fundo)}
  .reorder button[disabled]{opacity:.22;pointer-events:none}
  .reorder svg{width:14px;height:12px}
  .chip.fav{border-color:var(--amarelo)}
  .chip .fav-star{color:var(--amarelo);font-size:12px;margin-right:-2px}
  .filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;background:#fff;border:1.5px solid var(--cinza-claro);border-radius:30px;padding:7px 14px;
    font-weight:700;font-size:12.5px;color:var(--cinza);transition:.15s}
  .fchip.active{background:var(--azul-escuro);color:#fff;border-color:var(--azul-escuro)}
  .fchip.fav.active{background:var(--amarelo);color:var(--azul-escuro);border-color:var(--amarelo)}

  .msg-card{background:#fff;border-radius:var(--radius);box-shadow:var(--sombra);padding:14px;margin-bottom:12px;
    border-left:4px solid var(--azul)}
  .msg-card.fav{border-left-color:var(--amarelo)}
  .msg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
  .msg-title{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
  .msg-cat{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    background:var(--fundo);color:var(--cinza);padding:3px 9px;border-radius:20px;flex:none}
  .star{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px}
  .star svg{width:22px;height:22px;transition:.15s}
  .star.on svg{fill:var(--amarelo);stroke:var(--amarelo)}
  .star svg{fill:none;stroke:var(--cinza);stroke-width:1.8}
  .msg-text{font-size:14px;color:#2c3e5c;white-space:pre-wrap;word-break:break-word;
    background:var(--fundo);padding:10px 12px;border-radius:10px;margin:8px 0;max-height:150px;overflow:auto}
  .msg-actions{display:flex;gap:7px;flex-wrap:wrap}
  .msg-actions .btn{flex:1;min-width:92px}

  /* VAZIO */
  .empty{text-align:center;padding:50px 20px;color:var(--cinza)}
  .empty svg{width:64px;height:64px;opacity:.35;margin-bottom:14px}
  .empty h3{font-size:16px;font-weight:700;color:var(--texto);margin-bottom:6px}
  .empty p{font-size:14px;max-width:300px;margin:0 auto}

  /* RODAPÉ FERRAMENTAS */
  .tools{margin-top:24px;padding-top:16px;border-top:1px dashed var(--cinza-claro)}
  .tools-grid{display:flex;gap:8px;flex-wrap:wrap}
  .tools-grid .btn{flex:1;min-width:140px}
  .data-note{font-size:11.5px;color:var(--cinza);text-align:center;margin-top:12px;line-height:1.5}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(10,37,64,.55);z-index:100;display:none;
    align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(2px)}
  .overlay.open{display:flex;animation:fade .2s}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px;
    max-height:92vh;overflow-y:auto;animation:slideup .28s cubic-bezier(.2,.9,.3,1);
    padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  @media(min-width:560px){.overlay{align-items:center}.modal{border-radius:22px}
    .lists-bar,.filters{flex-wrap:wrap;overflow:visible}}
  .modal-grab{width:40px;height:4px;background:var(--cinza-claro);border-radius:10px;margin:0 auto 14px}
  .modal h3{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--cinza);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field textarea,.field select{width:100%;border:1.5px solid var(--cinza-claro);
    border-radius:12px;padding:12px 14px;background:var(--fundo);outline:none;transition:.15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--azul);background:#fff}
  .field textarea{resize:vertical;min-height:120px}
  .field .hint{font-size:11.5px;color:var(--cinza);margin-top:5px}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
  .emoji-pick button{width:42px;height:42px;border-radius:11px;font-size:20px;background:var(--fundo);
    border:2px solid transparent;transition:.15s}
  .emoji-pick button.sel{border-color:var(--azul);background:#E6F1FF}
  .modal-actions{display:flex;gap:10px;margin-top:8px}
  .modal-actions .btn{flex:1}

  /* TOAST */
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--azul-escuro);color:#fff;padding:13px 22px;border-radius:30px;font-weight:700;font-size:14px;
    box-shadow:var(--sombra-f);z-index:200;opacity:0;pointer-events:none;transition:.3s;display:flex;align-items:center;gap:9px;
    max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:18px;height:18px;flex:none}
  .toast.err{background:#D32F2F}

  input[type=file]{display:none}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="56" cy="50" r="33" fill="#fff" opacity=".12"/>
      <circle cx="58" cy="50" r="27" fill="#ffffff" opacity=".9"/>
      <g stroke="#FFC800" stroke-width="6" stroke-linecap="round">
        <path d="M44 50 L18 50"/><path d="M45 32 L23 24"/><path d="M45 68 L23 76"/>
        <path d="M50 28 L42 8"/><path d="M50 72 L42 92"/>
      </g>
      <path d="M60 28 L42 54 L54 54 L48 74 L70 46 L57 46 Z" fill="#FFC800"/>
    </svg>
    <div class="brand-txt">
      <h1>THM ENERGIA SOLAR</h1>
      <span>Central de Tarefas &amp; WhatsApp</span>
    </div>
  </div>
  <div class="tagline">Mais Energia Para Um Amanhã Melhor</div>
</header>

<nav class="tabs">
  <button id="tab-listas" class="active" onclick="switchTab('listas')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    CHECKLISTS
  </button>
  <button id="tab-msgs" onclick="switchTab('msgs')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    CENTRAL WHATSAPP
  </button>
</nav>

<main>
  <!-- ============ VIEW CHECKLISTS ============ -->
  <section id="view-listas" class="view active">
    <div class="lists-bar" id="listsBar"></div>
    <div id="listContainer"></div>

    <div class="tools">
      <div class="tools-grid">
        <button class="btn btn-ghost" onclick="exportData()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          BACKUP
        </button>
        <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          RESTAURAR
        </button>
      </div>
      <input type="file" id="importFile" accept="application/json" onchange="importData(event)">
      <p class="data-note">💾 Tudo é salvo automaticamente neste aparelho (funciona offline).<br>Faça BACKUP de vez em quando para não perder seus dados.</p>
    </div>
  </section>

  <!-- ============ VIEW MENSAGENS ============ -->
  <section id="view-msgs" class="view">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="msgSearch" placeholder="Buscar mensagem..." oninput="renderMessages()">
      </div>
      <button class="btn btn-amarelo btn-ico" onclick="openMsgModal()" title="Nova mensagem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="client-bar">
      <div class="client-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="clientName" placeholder="Nome do cliente (preenche as mensagens)" autocomplete="off" oninput="setClientName(this.value)">
        <button class="client-clear" id="clientClear" onclick="clearClient()" title="Limpar nome">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>

</main>

<script>
/* ============================================================
   THM ENERGIA SOLAR — Central de Tarefas & WhatsApp
   App 100% offline. Dados em localStorage.
   ============================================================ */
"use strict";

var LS_LISTS="thm_lists_v1", LS_MSGS="thm_msgs_v1", LS_UI="thm_ui_v1";
var state={lists:[],msgs:[],curList:null,msgFilter:"todas",clientName:""};
var ICONS=["📋","🤝","🛒","🧰","⚡","🏠","📅","🚗","💰","📞","📦","🔧","☀️","📝","✅","🎯"];
var CATS=["Saudação","Orçamento","Agendamento","Técnico","Pós-venda","Cobrança","Outros"];

/* ---------- Util ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function $(s){return document.querySelector(s);}
function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hoje(){var d=new Date();return d.toLocaleDateString("pt-BR");}

function save(){
  try{
    localStorage.setItem(LS_LISTS,JSON.stringify(state.lists));
    localStorage.setItem(LS_MSGS,JSON.stringify(state.msgs));
    localStorage.setItem(LS_UI,JSON.stringify({curList:state.curList,msgFilter:state.msgFilter}));
  }catch(e){toast("Erro ao salvar dados","err");}
}
function load(){
  try{
    var l=localStorage.getItem(LS_LISTS), m=localStorage.getItem(LS_MSGS), u=localStorage.getItem(LS_UI);
    state.lists=l?JSON.parse(l):null;
    state.msgs=m?JSON.parse(m):null;
    var ui=u?JSON.parse(u):{};
    state.curList=ui.curList||null; state.msgFilter=ui.msgFilter||"todas";
  }catch(e){state.lists=null;state.msgs=null;}
  if(!state.lists) state.lists=seedLists();
  if(!state.msgs) state.msgs=seedMsgs();
  if(!state.curList && state.lists.length) state.curList=state.lists[0].id;
}

/* ---------- Dados de exemplo (editáveis/apagáveis) ---------- */
function seedLists(){
  return [
    {id:uid(),name:"Reunião",icon:"🤝",items:[
      {id:uid(),text:"Confirmar presença dos participantes",done:false,comment:""},
      {id:uid(),text:"Preparar proposta comercial do cliente",done:false,comment:""},
      {id:uid(),text:"Levar notebook e projetor",done:false,comment:""}
    ]},
    {id:uid(),name:"Materiais a Comprar",icon:"🛒",items:[
      {id:uid(),text:"Cabo solar 6mm (preto e vermelho)",done:false,comment:"Verificar metragem do projeto"},
      {id:uid(),text:"Conectores MC4",done:false,comment:""},
      {id:uid(),text:"Disjuntores CC/CA",done:false,comment:""}
    ]},
    {id:uid(),name:"Missões / Exército",icon:"⚡",items:[
      {id:uid(),text:"Revisar escala do Hotel de Trânsito",done:false,comment:""}
    ]}
  ];
}
function seedMsgs(){
  return [
    {id:uid(),title:"Saudação inicial",cat:"Saudação",fav:true,
     text:"Olá, {{nome}}! 👋 Aqui é da *THM Energia Solar*. Como posso te ajudar hoje com seu projeto de energia solar? ☀️"},
    {id:uid(),title:"Envio de orçamento",cat:"Orçamento",fav:true,
     text:"{{nome}}, preparamos sua proposta de energia solar personalizada! 📄⚡\n\nCom o sistema você reduz sua conta de luz e valoriza seu imóvel. Qualquer dúvida estou à disposição!"},
    {id:uid(),title:"Agendar visita técnica",cat:"Agendamento",fav:false,
     text:"Para seguirmos, precisamos agendar uma visita técnica no local. 🏠\n\nQual o melhor dia e horário para você, {{nome}}?"},
    {id:uid(),title:"Pós-venda / acompanhamento",cat:"Pós-venda",fav:false,
     text:"Olá, {{nome}}! Passando para saber como está a geração do seu sistema solar. 🌞\n\nEstá tudo funcionando bem? A THM está sempre à disposição!"}
  ];
}

/* ===================== NAVEGAÇÃO ===================== */
function switchTab(tab){
  $("#tab-listas").classList.toggle("active",tab==="listas");
  $("#tab-msgs").classList.toggle("active",tab==="msgs");
  $("#view-listas").classList.toggle("active",tab==="listas");
  $("#view-msgs").classList.toggle("active",tab==="msgs");
}

/* ===================== CHECKLISTS ===================== */
function renderListsBar(){
  var bar=$("#listsBar"); bar.innerHTML="";
  state.lists.forEach(function(l){
    var done=l.items.filter(function(i){return i.done;}).length;
    var b=document.createElement("button");
    b.className="chip"+(l.id===state.curList?" active":"")+(l.fav?" fav":"");
    b.innerHTML=(l.fav?'<span class="fav-star">★</span>':'')+'<span class="emoji">'+l.icon+'</span>'+esc(l.name)+
      '<span class="count">'+done+"/"+l.items.length+'</span>';
    b.onclick=function(){state.curList=l.id;save();renderAll();};
    bar.appendChild(b);
  });
  var add=document.createElement("button");
  add.className="chip-add";
  add.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="width:15px;height:15px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>NOVA LISTA';
  add.onclick=function(){openListModal();};
  bar.appendChild(add);
}

function renderCurrentList(){
  var c=$("#listContainer");
  var l=state.lists.find(function(x){return x.id===state.curList;});
  if(!l){ c.innerHTML=emptyState("Nenhuma lista","Crie sua primeira lista para começar."); return; }

  var done=l.items.filter(function(i){return i.done;}).length;
  var total=l.items.length;
  var pct=total?Math.round(done/total*100):0;
  var li=state.lists.indexOf(l), nLists=state.lists.length;

  var html='<div class="card">';
  html+='<div class="list-head"><h2><span class="emoji">'+l.icon+'</span><span class="nm">'+esc(l.name)+'</span></h2>';
  html+='<div class="head-ctrls">';
  html+='<button class="list-star'+(l.fav?' on':'')+'" onclick="toggleListFav()" title="Favoritar lista"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>';
  html+='<button class="ico-btn" onclick="moveList(-1)" title="Mover p/ esquerda"'+(li<=0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>';
  html+='<button class="ico-btn" onclick="moveList(1)" title="Mover p/ direita"'+(li>=nLists-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
  html+='<div class="list-menu"><button class="ico-btn" onclick="toggleMenu(event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>';
  html+='<div class="menu-pop" id="listMenu">'
    +'<button onclick="openListModal(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>Renomear / ícone</button>'
    +'<button onclick="clearDone()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Limpar concluídas</button>'
    +'<button class="danger" onclick="deleteList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>Excluir lista</button>'
    +'</div></div></div></div>';

  html+='<div class="progress-wrap"><div class="progress-top"><span>'+done+' de '+total+' concluídas</span><span>'+pct+'%</span></div>'
    +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';

  html+='<div class="add-row"><input id="newItem" placeholder="Adicionar atividade..." onkeydown="if(event.key===\'Enter\')addItem()">'
    +'<button class="btn btn-azul btn-ico" onclick="addItem()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" style="width:18px;height:18px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>';

  if(total===0){
    html+='<div class="empty" style="padding:28px 10px"><h3>Lista vazia</h3><p>Adicione a primeira atividade acima.</p></div>';
  }else{
    l.items.forEach(function(it,idx){ html+=itemHTML(it,idx,total); });
  }

  html+='<div class="list-footer">';
  html+='<button class="btn btn-verde" onclick="copyList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>COPIAR P/ WHATSAPP</button>';
  html+='<button class="btn btn-amarelo" onclick="sendListWhats()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 0 1 8.413 3.488 11.82 11.82 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zM6.597 20.13c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.82 9.82 0 0 0 1.511 5.26l-.999 3.648 3.477-.907zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.372-.025-.521-.074-.148-.669-1.611-.916-2.206-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>ENVIAR</button>';
  html+='</div></div>';

  c.innerHTML=html;
  requestAnimationFrame(function(){var f=$(".progress-fill");if(f)f.style.width=pct+"%";});
}

function itemHTML(it,idx,total){
  var hasC=!!(it.comment&&it.comment.trim());
  var h='<div class="item'+(it.done?" done":"")+'" data-id="'+it.id+'">';
  h+='<div class="item-main">';
  h+='<button class="checkbox" onclick="toggleItem(\''+it.id+'\')"><svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg></button>';
  h+='<div class="item-body"><div class="item-text">'+esc(it.text)+'</div>';
  h+='<div class="comment-preview'+(hasC?" show":"")+'" id="cp-'+it.id+'">💬 '+esc(it.comment)+'</div>';
  h+='<div class="comment-box" id="cb-'+it.id+'"><textarea placeholder="Comentário / observação..." oninput="saveComment(\''+it.id+'\',this.value)">'+esc(it.comment||"")+'</textarea></div>';
  h+='</div>';
  h+='<div class="item-actions">';
  h+='<div class="reorder"><button onclick="moveItem(\''+it.id+'\',-1)" title="Subir"'+(idx<=0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button><button onclick="moveItem(\''+it.id+'\',1)" title="Descer"'+(idx>=total-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button></div>';
  h+='<button class="ico-btn'+(hasC?" has-comment":"")+'" onclick="toggleComment(\''+it.id+'\')" title="Comentário"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>';
  h+='<button class="ico-btn" onclick="editItem(\''+it.id+'\')" title="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>';
  h+='<button class="ico-btn" onclick="delItem(\''+it.id+'\')" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>';
  h+='</div></div></div>';
  return h;
}

function curList(){return state.lists.find(function(x){return x.id===state.curList;});}

function moveItem(id,dir){
  var l=curList(); if(!l)return; var i=-1;
  for(var k=0;k<l.items.length;k++){ if(l.items[k].id===id){i=k;break;} }
  var j=i+dir; if(i<0||j<0||j>=l.items.length)return;
  var t=l.items[i]; l.items[i]=l.items[j]; l.items[j]=t; save(); renderAll();
}
function moveList(dir){
  closeMenu();
  var i=-1; for(var k=0;k<state.lists.length;k++){ if(state.lists[k].id===state.curList){i=k;break;} }
  var j=i+dir; if(i<0||j<0||j>=state.lists.length)return;
  var t=state.lists[i]; state.lists[i]=state.lists[j]; state.lists[j]=t; save(); renderAll();
}
function toggleListFav(){
  var l=curList(); if(!l)return; l.fav=!l.fav; save(); renderAll();
}

function addItem(){
  var inp=$("#newItem"); if(!inp)return;
  var t=inp.value.trim(); if(!t)return;
  var l=curList(); if(!l)return;
  l.items.push({id:uid(),text:t,done:false,comment:""});
  inp.value=""; save(); renderAll();
  setTimeout(function(){var ni=$("#newItem");if(ni)ni.focus();},50);
}
function toggleItem(id){
  var l=curList(); var it=l.items.find(function(x){return x.id===id;});
  if(it){it.done=!it.done;save();renderAll();}
}
function toggleComment(id){
  var box=$("#cb-"+id); var prev=$("#cp-"+id);
  if(!box)return;
  var open=box.classList.toggle("open");
  if(prev)prev.classList.toggle("show",!open && prev.textContent.trim().length>2);
  if(open){var ta=box.querySelector("textarea");if(ta)ta.focus();}
}
function saveComment(id,val){
  var l=curList(); var it=l.items.find(function(x){return x.id===id;});
  if(it){it.comment=val;save();renderListsBar();}
}
function delItem(id){
  if(!confirm("Excluir esta atividade?"))return;
  var l=curList(); l.items=l.items.filter(function(x){return x.id!==id;});
  save(); renderAll();
}
function editItem(id){
  var l=curList(); var it=l.items.find(function(x){return x.id===id;});
  if(!it)return;
  var nv=prompt("Editar atividade:",it.text);
  if(nv!==null && nv.trim()){it.text=nv.trim();save();renderAll();}
}
function clearDone(){
  closeMenu();
  var l=curList(); var n=l.items.filter(function(i){return i.done;}).length;
  if(!n){toast("Nenhuma concluída para limpar");return;}
  if(!confirm("Remover "+n+" atividade(s) concluída(s)?"))return;
  l.items=l.items.filter(function(i){return !i.done;});
  save(); renderAll(); toast(n+" removida(s)");
}
function deleteList(){
  closeMenu();
  if(state.lists.length<=1){toast("Mantenha ao menos uma lista","err");return;}
  var l=curList();
  if(!confirm('Excluir a lista "'+l.name+'" e todas as atividades?'))return;
  state.lists=state.lists.filter(function(x){return x.id!==state.curList;});
  state.curList=state.lists[0].id;
  save(); renderAll(); toast("Lista excluída");
}

function toggleMenu(e){e.stopPropagation();var m=$("#listMenu");if(m)m.classList.toggle("open");}
function closeMenu(){var m=$("#listMenu");if(m)m.classList.remove("open");}
document.addEventListener("click",function(e){
  var m=$("#listMenu");
  if(m&&m.classList.contains("open")&&!e.target.closest(".list-menu"))closeMenu();
});

/* ---- Copiar / enviar lista p/ WhatsApp ---- */
function buildListText(){
  var l=curList(); if(!l)return "";
  var done=l.items.filter(function(i){return i.done;}).length;
  var t="*THM ENERGIA SOLAR*\n"+l.icon+" *"+l.name.toUpperCase()+"*\n🗓️ "+hoje()+"\n\n";
  if(l.items.length===0){t+="_(sem atividades)_\n";}
  l.items.forEach(function(it){
    t+=(it.done?"✅ ":"⬜ ")+it.text+"\n";
    if(it.comment&&it.comment.trim()) t+="   ↳ _"+it.comment.trim()+"_\n";
  });
  t+="\n📊 Progresso: "+done+"/"+l.items.length+" concluídas";
  return t;
}
function copyList(){
  var t=buildListText(); if(!t){toast("Lista vazia","err");return;}
  copyText(t,"Lista copiada! Cole no WhatsApp 📋");
}
function sendListWhats(){
  var t=buildListText(); if(!t){toast("Lista vazia","err");return;}
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}

/* ---- Modal Nova/Editar lista ---- */
function openListModal(editing){
  var l=editing?curList():null;
  var selIcon=l?l.icon:"📋";
  var html='<div class="modal-grab"></div><h3>'+(editing?"✏️ Editar lista":"➕ Nova lista")+'</h3>';
  html+='<div class="field"><label>Nome da lista</label><input id="mList" placeholder="Ex: Checklist Reunião" value="'+(l?esc(l.name):"")+'"></div>';
  html+='<div class="field"><label>Ícone</label><div class="emoji-pick" id="emojiPick">';
  ICONS.forEach(function(ic){html+='<button type="button" class="'+(ic===selIcon?"sel":"")+'" onclick="pickEmoji(this)">'+ic+'</button>';});
  html+='</div></div>';
  html+='<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-azul" onclick="saveList('+(editing?"true":"false")+')">Salvar</button></div>';
  openModal(html);
  setTimeout(function(){var i=$("#mList");if(i){i.focus();}},100);
  window._tmpIcon=selIcon;
}
function pickEmoji(btn){
  document.querySelectorAll("#emojiPick button").forEach(function(b){b.classList.remove("sel");});
  btn.classList.add("sel"); window._tmpIcon=btn.textContent;
}
function saveList(editing){
  var nm=$("#mList").value.trim();
  if(!nm){toast("Digite um nome","err");return;}
  var ic=window._tmpIcon||"📋";
  if(editing){var l=curList();l.name=nm;l.icon=ic;}
  else{var nl={id:uid(),name:nm,icon:ic,items:[]};state.lists.push(nl);state.curList=nl.id;}
  save();closeModal();renderAll();toast(editing?"Lista atualizada":"Lista criada ✅");
}

/* ===================== MENSAGENS WHATSAPP ===================== */
function renderMsgFilters(){
  var f=$("#msgFilters"); f.innerHTML="";
  var opts=[{k:"todas",t:"Todas"},{k:"fav",t:"⭐ Favoritas"}];
  CATS.forEach(function(c){opts.push({k:"cat:"+c,t:c});});
  opts.forEach(function(o){
    var b=document.createElement("button");
    var act=state.msgFilter===o.k;
    b.className="fchip"+(act?" active":"")+(o.k==="fav"?" fav":"");
    b.textContent=o.t;
    b.onclick=function(){state.msgFilter=o.k;save();renderMessages();renderMsgFilters();};
    f.appendChild(b);
  });
}
function renderMessages(){
  var c=$("#msgContainer");
  var q=($("#msgSearch")?$("#msgSearch").value:"").toLowerCase().trim();
  var list=state.msgs.filter(function(m){
    if(state.msgFilter==="fav"&&!m.fav)return false;
    if(state.msgFilter.indexOf("cat:")===0&&m.cat!==state.msgFilter.slice(4))return false;
    if(q&&(m.title+" "+m.text+" "+m.cat).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  list.sort(function(a,b){return (b.fav?1:0)-(a.fav?1:0);});
  if(list.length===0){
    c.innerHTML=emptyState("Nenhuma mensagem","Toque no + para criar seu primeiro modelo de resposta para WhatsApp.");
    return;
  }
  var html="";
  list.forEach(function(m){
    html+='<div class="msg-card'+(m.fav?" fav":"")+'">';
    html+='<div class="msg-head"><div class="msg-title"><span class="msg-cat">'+esc(m.cat)+'</span><span>'+esc(m.title)+'</span></div>';
    html+='<button class="star'+(m.fav?" on":"")+'" onclick="toggleFav(\''+m.id+'\')"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button></div>';
    var prev=esc(m.text);
    if(state.clientName){prev=prev.replace(/\{\{\s*(nome|cliente)\s*\}\}/gi,'<span class="ph-fill">'+esc(state.clientName)+'</span>');}
    html+='<div class="msg-text">'+prev+'</div>';
    html+='<div class="msg-actions">';
    html+='<button class="btn btn-verde btn-sm" onclick="copyMsg(\''+m.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copiar</button>';
    html+='<button class="btn btn-amarelo btn-sm" onclick="sendMsg(\''+m.id+'\')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 0 1 8.413 3.488 11.82 11.82 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24z"/></svg>Enviar</button>';
    html+='<button class="btn btn-ghost btn-sm" onclick="openMsgModal(\''+m.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>';
    html+='<button class="btn btn-ghost btn-sm" onclick="delMsg(\''+m.id+'\')" style="color:#D32F2F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>';
    html+='</div></div>';
  });
  c.innerHTML=html;
}
function toggleFav(id){
  var m=state.msgs.find(function(x){return x.id===id;});
  if(m){m.fav=!m.fav;save();renderMessages();}
}
function delMsg(id){
  if(!confirm("Excluir esta mensagem?"))return;
  state.msgs=state.msgs.filter(function(x){return x.id!==id;});
  save();renderMessages();toast("Mensagem excluída");
}
function openMsgModal(id){
  var m=id?state.msgs.find(function(x){return x.id===id;}):null;
  var html='<div class="modal-grab"></div><h3>'+(m?"✏️ Editar mensagem":"➕ Nova mensagem")+'</h3>';
  html+='<div class="field"><label>Título</label><input id="mTitle" placeholder="Ex: Saudação inicial" value="'+(m?esc(m.title):"")+'"></div>';
  html+='<div class="field"><label>Categoria</label><select id="mCat">';
  CATS.forEach(function(c){html+='<option'+(m&&m.cat===c?" selected":"")+'>'+c+'</option>';});
  html+='</select></div>';
  html+='<div class="field"><label>Mensagem</label><textarea id="mText" placeholder="Digite a resposta...">'+(m?esc(m.text):"")+'</textarea>'
    +'<div class="hint">💡 Use *texto* para negrito no WhatsApp. Escreva <b>{{nome}}</b> onde quiser o nome do cliente — ele é preenchido automaticamente pelo campo "Nome do cliente" no topo. Outros campos como <b>{{valor}}</b> são perguntados na hora de copiar/enviar.</div></div>';
  html+='<div class="field" style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="mFav" style="width:20px;height:20px" '+(m&&m.fav?"checked":"")+'><label style="margin:0;text-transform:none;font-size:14px;color:var(--texto)">⭐ Marcar como favorita</label></div>';
  html+='<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-azul" onclick="saveMsg('+(m?"'"+id+"'":"null")+')">Salvar</button></div>';
  openModal(html);
  setTimeout(function(){var i=$("#mTitle");if(i)i.focus();},100);
}
function saveMsg(id){
  var title=$("#mTitle").value.trim();
  var text=$("#mText").value.trim();
  var cat=$("#mCat").value;
  var fav=$("#mFav").checked;
  if(!title){toast("Digite um título","err");return;}
  if(!text){toast("Digite a mensagem","err");return;}
  if(id){var m=state.msgs.find(function(x){return x.id===id;});m.title=title;m.text=text;m.cat=cat;m.fav=fav;}
  else{state.msgs.push({id:uid(),title:title,text:text,cat:cat,fav:fav});}
  save();closeModal();renderMessages();renderMsgFilters();toast(id?"Mensagem atualizada":"Mensagem criada ✅");
}

/* ---- Preencher campos {{...}} antes de copiar/enviar ---- */
function fillPlaceholders(text,cb){
  var re=/\{\{\s*([^}]+?)\s*\}\}/g, found=[], seen={}, m;
  while((m=re.exec(text))!==null){var k=m[1];if(!seen[k]){seen[k]=true;found.push(k);}}
  if(found.length===0){cb(text);return;}
  var out=text;
  for(var i=0;i<found.length;i++){
    var v=prompt('Preencher "'+found[i]+'":',"");
    if(v===null){return;} // cancelou
    var rx=new RegExp("\\{\\{\\s*"+found[i].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*\\}\\}","g");
    out=out.replace(rx,v);
  }
  cb(out);
}
function applyClientName(text){
  if(!state.clientName||!state.clientName.trim())return text;
  return text.replace(/\{\{\s*(nome|cliente)\s*\}\}/gi,state.clientName.trim());
}
function setClientName(v){
  state.clientName=v;
  var c=document.getElementById("clientClear");
  if(c)c.classList.toggle("show",!!v.trim());
  renderMessages();
}
function clearClient(){
  var i=document.getElementById("clientName");
  if(i)i.value="";
  setClientName("");
  if(i)i.focus();
}
function copyMsg(id){
  var m=state.msgs.find(function(x){return x.id===id;});if(!m)return;
  fillPlaceholders(applyClientName(m.text),function(t){copyText(t,"Mensagem copiada! 📋");});
}
function sendMsg(id){
  var m=state.msgs.find(function(x){return x.id===id;});if(!m)return;
  fillPlaceholders(applyClientName(m.text),function(t){
    var fone=prompt("Número do cliente com DDD (opcional)\nEx: 68999998888\nDeixe em branco para só abrir o WhatsApp:","");
    if(fone===null)return;
    fone=fone.replace(/\D/g,"");
    var url=fone?("https://wa.me/55"+fone+"?text="+encodeURIComponent(t)):("https://wa.me/?text="+encodeURIComponent(t));
    window.open(url,"_blank");
  });
}

/* ===================== GENÉRICOS ===================== */
function emptyState(title,txt){
  return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
    +'<h3>'+title+'</h3><p>'+txt+'</p></div>';
}
function openModal(html){$("#modal").innerHTML=html;$("#overlay").classList.add("open");}
function closeModal(){$("#overlay").classList.remove("open");}

function copyText(t,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){fallbackCopy(t,msg);});
  }else{fallbackCopy(t,msg);}
}
function fallbackCopy(t,msg){
  var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");toast(msg);}catch(e){toast("Não foi possível copiar","err");}
  document.body.removeChild(ta);
}

var toastT;
function toast(msg,type){
  var el=$("#toast");
  el.className="toast"+(type==="err"?" err":"");
  el.innerHTML=(type==="err"?'':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>')+esc(msg);
  el.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.classList.remove("show");},2400);
}

/* ---- Backup / Restaurar ---- */
function exportData(){
  var data={v:1,exportado:new Date().toISOString(),lists:state.lists,msgs:state.msgs};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="THM_backup_"+hoje().replace(/\//g,"-")+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Backup gerado! 💾");
}
function importData(ev){
  var file=ev.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.lists&&!d.msgs)throw new Error("inv");
      if(!confirm("Restaurar backup? Isso SUBSTITUI as listas e mensagens atuais."))return;
      if(d.lists)state.lists=d.lists;
      if(d.msgs)state.msgs=d.msgs;
      if(state.lists.length)state.curList=state.lists[0].id;
      save();renderAll();renderMessages();renderMsgFilters();
      toast("Backup restaurado! ✅");
    }catch(e){toast("Arquivo inválido","err");}
  };
  r.readAsText(file);
  ev.target.value="";
}

function renderAll(){renderListsBar();renderCurrentList();}

/* ---- Init ---- */
load();
renderAll();
renderMsgFilters();
renderMessages();
</script>
